# What the pipeline pulls. Change scope here, not in code.
countries: [NGA, KEN, GHA, RWA, ZAF]
start_year: 2000
end_year: 2025
indicators:
  NY.GDP.MKTP.KD.ZG: gdp_growth_pct
  SI.POV.DDAY: poverty_pct
  IT.CEL.SETS.P2: mobile_per_100
  SL.UEM.TOTL.ZS: unemployment_pct
  NY.GDP.PCAP.KD.ZG: gdp_per_capita_growth_pct
  SL.EMP.VULN.ZS: vulnerable_employment_pct
  SI.DST.FRST.20: income_share_bottom20_pct
  EG.ELC.ACCS.ZS: electricity_access_pct
  SP.DYN.LE00.IN: life_expectancy_years

# Where the raw data lands. Project ids are not secrets; credentials are never stored here.
bigquery:
  project: econdev-portfolio-alice
  raw_table: raw.worldbank_indicators
