version: 2

models:
  - name: fct_growth_vs_development
    description: >
      Analysis-ready table: one row per country and year (130 rows), each
      indicator plus derived trends. Use for year-by-year charts. Poverty is
      null in years without a survey; filter on is_poverty_survey_year to see
      only measured values.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, year]
      # The mart adds columns but must never add or drop rows
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('int_indicators_pivoted')
    columns:
      - name: country_iso3
        description: "ISO 3166-1 alpha-3 country code"
        data_tests:
          - not_null
      - name: country_name
        description: "Country name"
      - name: year
        description: "Calendar year"
        data_tests:
          - not_null
      - name: gdp_growth_pct
        description: "Annual GDP growth, %"
      - name: gdp_per_capita_growth_pct
        description: "Annual GDP growth per person, %"
      - name: gdp_growth_5yr_avg
        description: "Average GDP growth over this year and the 4 before it. Null until 5 years of data exist"
      - name: poverty_pct
        description: "% of population below $3.00 a day (2021 PPP). Null in non-survey years"
      - name: is_poverty_survey_year
        description: "True when poverty_pct holds a real survey measurement for this year"
        data_tests:
          - not_null
      - name: income_share_bottom20_pct
        description: "Share of income or consumption held by the poorest 20%, %. Null in non-survey years"
      - name: unemployment_pct
        description: "Unemployment, % of labour force (modeled ILO estimate)"
      - name: unemployment_change_pp
        description: "Change in unemployment vs the previous year, in percentage points"
      - name: vulnerable_employment_pct
        description: "Own-account and unpaid family workers, % of employment (modeled ILO estimate). A proxy for informal work"
      - name: electricity_access_pct
        description: "% of population with access to electricity"
      - name: life_expectancy_years
        description: "Life expectancy at birth, years"
      - name: mobile_per_100
        description: "Mobile subscriptions per 100 people"
      - name: mobile_change_per_100
        description: "Change in mobile subscriptions per 100 people vs the previous year"

  - name: fct_poverty_survey_spans
    description: >
      One row per country per pair of consecutive poverty surveys. Compares the
      change in poverty between two surveys with GDP growth over the same years.
      This is the main table for answering "is growth translating into
      broad-based development?", because poverty is only measured in survey years.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, start_year]
      # A span must move forward in time
      - dbt_utils.expression_is_true:
          arguments:
            expression: "end_year > start_year"
    columns:
      - name: country_iso3
        description: "ISO 3166-1 alpha-3 country code"
        data_tests:
          - not_null
          # Every span's country must exist in the country-year mart
          - relationships:
              arguments:
                to: ref('fct_growth_vs_development')
                field: country_iso3
      - name: country_name
        description: "Country name"
      - name: start_year
        description: "Year of the earlier survey"
        data_tests:
          - not_null
      - name: end_year
        description: "Year of the later survey"
        data_tests:
          - not_null
      - name: span_years
        description: "Years between the two surveys"
      - name: poverty_start_pct
        description: "Poverty rate at the earlier survey, %"
        data_tests:
          - not_null
      - name: poverty_end_pct
        description: "Poverty rate at the later survey, %"
        data_tests:
          - not_null
      - name: poverty_change_pp
        description: "Change in poverty, percentage points. Negative = poverty fell"
      - name: avg_gdp_growth_pct
        description: "Average annual GDP growth over the years after start_year up to end_year"
        data_tests:
          - not_null
      - name: cumulative_gdp_growth_pct
        description: "Total compounded GDP growth over the span, %"
        data_tests:
          - not_null
      - name: avg_gdp_per_capita_growth_pct
        description: "Average annual GDP growth per person over the same years as avg_gdp_growth_pct"
        data_tests:
          - not_null
      - name: bottom20_start_pct
        description: "Income share of the poorest 20% at the earlier survey, %"
        data_tests:
          # Comes from the same surveys as poverty, so it should never be missing here
          - not_null
      - name: bottom20_end_pct
        description: "Income share of the poorest 20% at the later survey, %"
        data_tests:
          - not_null
      - name: bottom20_change_pp
        description: "Change in the poorest 20%'s income share, percentage points. Positive = they got a bigger slice"
      - name: unemployment_start_pct
        description: "Unemployment in start_year, %"
      - name: unemployment_end_pct
        description: "Unemployment in end_year, %"
      - name: unemployment_change_pp
        description: "Change in unemployment over the span, percentage points"
