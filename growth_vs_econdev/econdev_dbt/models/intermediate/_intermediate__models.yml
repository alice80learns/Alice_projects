version: 2

models:
  - name: int_indicators_pivoted
    description: >
      Staging pivoted from long to wide: one row per country and year
      (5 countries x 26 years = 130 rows), one column per indicator (9 indicators).
      Nulls are kept: a null means that indicator wasn't measured that year.
    data_tests:
      # Grain: the pivot must produce exactly one row per country and year
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, year]
    columns:
      - name: country_iso3
        description: "ISO 3166-1 alpha-3 country code"
        data_tests:
          - not_null
      - name: country_name
        description: "Country name as the World Bank spells it"
        data_tests:
          - not_null
      - name: year
        description: "Calendar year"
        data_tests:
          - not_null
      - name: gdp_growth_pct
        description: "Annual GDP growth, % (NY.GDP.MKTP.KD.ZG)"
        data_tests:
          # Plausibility check, not a hard rule: real growth can be extreme
          # (war, pandemic), so this warns instead of failing the build.
          - dbt_utils.accepted_range:
              arguments:
                min_value: -30
                max_value: 30
              config:
                severity: warn
      - name: poverty_pct
        description: "% of population below $3.00 a day, 2021 PPP (SI.POV.DDAY). Null in non-survey years"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: mobile_per_100
        description: "Mobile cellular subscriptions per 100 people (IT.CEL.SETS.P2). Can exceed 100"
        data_tests:
          # Over 100 is normal (people own several SIMs), but over 250 would suggest a units bug
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 250
      - name: unemployment_pct
        description: "Unemployment, % of labour force, modeled ILO estimate (SL.UEM.TOTL.ZS)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: gdp_per_capita_growth_pct
        description: "Annual GDP growth per person, % (NY.GDP.PCAP.KD.ZG). GDP growth minus population growth, roughly"
        data_tests:
          # Same reasoning as gdp_growth_pct: extreme years are rare but real, so warn only
          - dbt_utils.accepted_range:
              arguments:
                min_value: -30
                max_value: 30
              config:
                severity: warn
      - name: vulnerable_employment_pct
        description: "Own-account and unpaid family workers, % of total employment, modeled ILO estimate (SL.EMP.VULN.ZS). A proxy for informal work"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: income_share_bottom20_pct
        description: "Share of income or consumption held by the poorest 20%, % (SI.DST.FRST.20). From household surveys: null in non-survey years"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: electricity_access_pct
        description: "% of population with access to electricity (EG.ELC.ACCS.ZS)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: life_expectancy_years
        description: "Life expectancy at birth, years (SP.DYN.LE00.IN)"
        data_tests:
          # Below 30 or above 90 would point to a units or parsing bug
          - dbt_utils.accepted_range:
              arguments:
                min_value: 30
                max_value: 90
